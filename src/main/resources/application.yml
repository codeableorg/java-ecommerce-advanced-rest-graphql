spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/ecommerce_db
    username: root
    password: password
    pool:
      enabled: true
      initial-size: 20
      max-size: 500
      max-idle-time: 30m

  # Flyway configuration (uses JDBC for migrations)
  flyway:
    url: jdbc:mysql://localhost:3306/ecommerce_db
    user: root
    password: password
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Remove sql.init - now using Flyway
  # sql:
  #   init:
  #     mode: always
server:
  port: 8080
logging:
  level:
    root: INFO
