spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/ecommerce_db
    username: root
    password: password
    pool:
      enabled: true
      initial-size: 20
      max-size: 500
      max-idle-time: 30m

  # Flyway configuration (uses JDBC for migrations)
  flyway:
    url: jdbc:mysql://localhost:3306/ecommerce_db
    user: root
    password: password
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081 # Cambio: Gateway toma 8080, inventory-service 8082, monolito va a 8081

# Microservices configuration
inventory-service:
  base-url: http://localhost:8082

logging:
  level:
    root: INFO
